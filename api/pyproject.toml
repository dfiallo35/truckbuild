[project]
name = "truckbuild-api"
version = "0.1.0"
description = "TruckBuild catalog, configurator pricing, and quote API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyyaml>=6.0.3",
    "sentry-sdk[fastapi]>=2.68.1",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

# Vercel serves this app as a Python function rather than a container, so it needs to be told
# where the ASGI callable is. Without this it looks for `app` in a conventional entrypoint file
# (api/index.py, main.py) and finds nothing, and the deploy succeeds while every route 404s.
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
