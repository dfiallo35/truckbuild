[project]
name = "truckbuild-api"
version = "0.1.0"
description = "TruckBuild catalog, configurator pricing, and quote API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyyaml>=6.0.3",
    "sentry-sdk[fastapi]>=2.68.1",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

# Vercel serves this app as a Python function rather than a container, so it needs to be told
# where the ASGI callable is. Without this it looks for `app` in a conventional entrypoint file
# (api/index.py, main.py) and finds nothing, and the deploy succeeds while every route 404s.
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

# Without this, ruff's import sorter guesses at which of app/ and tests/ are local and
# reshuffles the blocks on whatever unrelated file is touched next.
[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "import-linter>=2.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

# The architecture, as something CI can fail on rather than something a reviewer has to notice.
# See docs/stages/08-modules-and-layers.md for what each rule buys and why the boundary is drawn
# where it is. Run with `uv run lint-imports`.
#
# `include_external_packages` is what lets the two purity contracts below name fastapi, httpx and
# sqlmodel at all; without it those are unknown modules and the contracts error rather than run.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers within every module"
type = "layers"
# presentation and infrastructure are siblings -- both are adapters, and neither may reach the
# other. `containers` applies the rule to all three modules at once, so a fourth module is
# covered the day it is created rather than the day someone remembers to add it here.
# Parentheses mark a layer that need not exist: admin owns no entities and no tables, so it
# carries neither a domain nor an infrastructure -- a module carries only the layers it needs.
# A module's `dependencies.py` sits beside the four layers rather than inside one, the way
# `core/config.py` sits beside the kernel's: it is the composition root, the one file that has to
# see an adapter and an inner layer at once. `exhaustive = false` is what leaves room for it.
layers = ["presentation | (infrastructure)", "application", "(domain)"]
containers = ["app.modules.catalog", "app.modules.quotes", "app.modules.admin"]
exhaustive = false
ignore_imports = [
    # Stage 11 replaces this with the router calling a use case that owns the mail port.
    "app.modules.quotes.presentation.router -> app.modules.quotes.infrastructure.mail",
    # Stage 11 moves QuoteDetail off the wire layer, so the mail adapter renders a use-case
    # result rather than a response schema.
    "app.modules.quotes.infrastructure.mail -> app.modules.quotes.presentation.schemas",
]

[[tool.importlinter.contracts]]
name = "Layers within core"
# The same rule the modules already carry, now that `core` has the same four layers. `core` is a
# module in every respect except that everything is allowed to import it -- so the kernel that
# every feature builds on cannot itself have a domain that reaches for a web framework, which is
# what would quietly make every module's domain impure by inheritance.
# `config.py` is deliberately outside the layers: it is read by every one of them and belongs to
# none, which is what `exhaustive = false` leaves room for.
type = "layers"
layers = ["presentation | infrastructure", "application", "domain"]
containers = ["app.core"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Kernel purity"
# The inner two layers of the kernel name neither a database nor a web framework. This is the
# rule that makes the rest of the migration possible: `BaseEntity` is what every module's
# entities move onto in Stages 10-12, and an impure base class would make every one of them
# impure by inheritance -- at which point the "domain forbids persistence" contract Stage 10
# turns on could never go green. Asserted in docstrings since this stage; checked from here on.
type = "forbidden"
source_modules = ["app.core.domain", "app.core.application"]
forbidden_modules = ["fastapi", "starlette", "sqlmodel", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Module direction"
# admin -> quotes -> catalog -> core, and the arrows only point one way. A layers contract over
# the four gives the whole DAG in one rule, including "core imports no module, ever".
type = "layers"
layers = [
    "app.modules.admin",
    "app.modules.quotes",
    "app.modules.catalog",
    "app.core",
]

# The facade rule -- another module sees only `application` and `domain`, never `presentation` or
# `infrastructure`. The test: if this module were pulled out behind an HTTP call tomorrow, would
# the import still make sense? One contract per importable module, because a forbidden contract
# cannot name the same package as both source and target, and `quotes` is both. `admin` needs no
# contract of its own: nothing imports admin, which "Module direction" already enforces.
[[tool.importlinter.contracts]]
name = "Facade of catalog"
type = "forbidden"
source_modules = ["app.modules.quotes", "app.modules.admin"]
forbidden_modules = [
    "app.modules.catalog.presentation",
    "app.modules.catalog.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Facade of quotes"
type = "forbidden"
source_modules = ["app.modules.admin"]
forbidden_modules = [
    "app.modules.quotes.presentation",
    "app.modules.quotes.infrastructure",
]
ignore_imports = [
    # Same QuoteDetail as above: admin renders a stored lead through the quotes module's wire
    # schema. Stage 12 gives admin its own output DTOs instead.
    "app.modules.admin.presentation.router -> app.modules.quotes.presentation.schemas",
]

[[tool.importlinter.contracts]]
name = "Domain isolation"
# A domain that imports a web framework is a domain that cannot be tested without one.
type = "forbidden"
source_modules = [
    "app.modules.catalog.domain",
    "app.modules.quotes.domain",
]
forbidden_modules = ["fastapi", "starlette", "httpx"]

[[tool.importlinter.contracts]]
name = "Domain forbids persistence"
# The whole migration, restated as a rule CI enforces: an entity is a fact about the business, not
# a row. This is the line that measures whether the entity split was worth doing -- and it is only
# true of `catalog` and of the kernel so far. `quotes.domain` still *is* a set of SQLModel tables
# until Stage 11, and `admin` owns no data at all; the scope widens in Stages 11 and 12 until it
# reads `app.modules.*.domain`.
type = "forbidden"
source_modules = [
    "app.core.domain",
    "app.modules.catalog.domain",
]
forbidden_modules = ["sqlmodel", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Presentation forbids persistence"
# A router that composes its own query is a router that has to be read to know what the endpoint
# costs. With the queries behind a repository, `presentation` is left with what is genuinely about
# HTTP -- status codes, headers, cache validators. Same widening schedule as the contract above:
# `quotes` and `admin` still write SQL in their routers until Stages 11 and 12.
type = "forbidden"
source_modules = ["app.modules.catalog.presentation"]
forbidden_modules = ["sqlmodel", "sqlalchemy"]
# Direct imports only, which is what the rule actually says: no file under `presentation/` names a
# persistence type. Indirectly every router reaches Postgres -- that is what an endpoint is for --
# through the module's composition root (`app/modules/catalog/dependencies.py`), which sits
# outside the four layers precisely because it is allowed to see both sides. The stage checkpoint
# greps for the same thing.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Pricing mirror purity"
# price_build and validate_selection are duplicated in web/src/lib/. Keeping the Python side free
# of the ORM is what lets one shared fixture file test both -- see .claude/skills/pricing-mirror.
# Asserted in a docstring since stage 1; checked from here on.
type = "forbidden"
source_modules = [
    "app.modules.catalog.domain.pricing",
    "app.modules.catalog.domain.rules",
]
forbidden_modules = ["sqlmodel", "sqlalchemy", "fastapi"]
