# Versioned seed content for the TruckBuild catalog. Loaded idempotently (upsert by slug) by
# app/seed.py. Postgres remains the runtime source of truth; this file is the reviewable,
# version-controlled starting point for it.
#
# All names, prices, and specs are demo placeholders — see docs/domain-model.md.

platforms:
  - slug: bristlecone
    name: Bristlecone
    purpose: Expedition / overland habitat
    chassis_basis: Ram 5500 4x4 (regular / crew cab)
    base_price_cents: 21450000
    spec_highlights:
      - 4x4 drivetrain, 12,000 lb GVWR
      - Dual diesel fuel tanks, 800 mi range
      - Insulated composite habitat shell
    standard_equipment:
      - LED perimeter lighting
      - Underbody skid plates
      - 40 gal fresh water tank
    hero_image:
      url: /images/bristlecone/hero.jpg
      alt_text: Bristlecone expedition truck parked on a desert ridge at dusk
    gallery:
      - url: /images/bristlecone/gallery-1.jpg
        alt_text: Bristlecone habitat interior with full galley
      - url: /images/bristlecone/gallery-2.jpg
        alt_text: Bristlecone rear three-quarter view with rooftop tent deployed
    # The 3D build view's asset (Stage 15 uploads the bytes; no url here yet). Framing is
    # content, not code -- see docs/stages/14-build-model-catalog.md.
    model:
      alt_text: Bristlecone expedition truck, 3D build model in standard configuration
      camera_orbit_deg: 35
      camera_distance_m: 9.5
      camera_target_y_m: 1.6
    option_groups:
      - slug: cab-chassis
        name: Cab & Chassis
        selection_mode: single
        required: true
        display_style: card
        options:
          - slug: cab-regular
            name: Regular Cab
            price_delta_cents: 0
            description: Two-door cab, maximum habitat footprint.
          - slug: cab-crew
            name: Crew Cab
            price_delta_cents: 850000
            description: Four-door cab with rear bench seating.
            model_effect:
              nodes: [bristlecone_cab-chassis_cab-crew]

      - slug: habitat-shell
        name: Habitat Shell
        selection_mode: single
        required: true
        display_style: card
        options:
          - slug: shell-standard
            name: Standard Composite Shell
            price_delta_cents: 0
            description: Insulated composite panel shell, standard height.
          - slug: shell-extended
            name: Extended Composite Shell
            price_delta_cents: 1200000
            description: Raised roofline for standing headroom throughout.
            model_effect:
              nodes: [bristlecone_habitat-shell_shell-extended]

      - slug: interior-layout
        name: Interior Layout
        selection_mode: single
        required: true
        display_style: card
        options:
          - slug: galley-compact
            name: Compact Galley
            price_delta_cents: 0
            description: Single-burner galley with under-counter fridge.
          - slug: galley-full
            name: Full Galley
            price_delta_cents: 650000
            description: Two-burner galley, full-size fridge, and dry storage.
          - slug: layout-bunk
            name: Bunk Layout
            price_delta_cents: 480000
            description: Fixed bunk with under-bed storage, no galley.

      - slug: power-system
        name: Power System
        selection_mode: multi
        required: false
        display_style: toggle
        options:
          - slug: lithium-300ah
            name: 300 Ah Lithium Bank
            price_delta_cents: 950000
            description: 300 Ah lithium battery bank with 2000 W inverter.
          - slug: lithium-600ah
            name: 600 Ah Lithium Bank
            price_delta_cents: 1850000
            description: 600 Ah lithium battery bank with 3000 W inverter.
          - slug: solar-standard
            name: Standard Solar Array (200 W)
            price_delta_cents: 180000
            description: Roof-mounted 200 W solar array.
            model_effect:
              nodes: [bristlecone_power-system_solar-standard]
          - slug: solar-max
            name: Maximum Solar Array (600 W)
            price_delta_cents: 420000
            description: Roof-mounted 600 W solar array, covers most of the roofline.
            model_effect:
              nodes: [bristlecone_power-system_solar-max]

      - slug: water-thermal
        name: Water & Thermal
        selection_mode: multi
        required: false
        display_style: toggle
        options:
          - slug: water-80gal
            name: 80 gal Fresh Water Upgrade
            price_delta_cents: 320000
            description: Upgrades the standard 40 gal tank to 80 gal.
          - slug: heater-diesel
            name: Diesel-Fired Cabin Heater
            price_delta_cents: 275000
            description: Combustion heater independent of the engine.
          - slug: ac-rooftop
            name: Rooftop Air Conditioning
            price_delta_cents: 410000
            description: Low-profile rooftop AC unit.
            model_effect:
              nodes: [bristlecone_water-thermal_ac-rooftop]

      - slug: suspension-tires
        name: Suspension & Tires
        selection_mode: single
        required: true
        display_style: card
        options:
          - slug: suspension-standard
            name: Standard Suspension, All-Terrain Tires
            price_delta_cents: 0
            description: Factory suspension with all-terrain tires.
          - slug: suspension-longtravel
            name: Long-Travel Suspension, All-Terrain Tires
            price_delta_cents: 680000
            description: Long-travel coilover suspension, all-terrain tires.
            model_effect:
              nodes: [bristlecone_suspension-tires_suspension-longtravel]
          - slug: suspension-longtravel-mt
            name: Long-Travel Suspension, Mud-Terrain Tires
            price_delta_cents: 890000
            description: Long-travel coilover suspension, mud-terrain tires.
            model_effect:
              nodes: [bristlecone_suspension-tires_suspension-longtravel-mt]

      - slug: recovery-protection
        name: Recovery & Protection
        selection_mode: multi
        required: false
        display_style: toggle
        options:
          - slug: bumper-standard
            name: Standard Steel Bumper
            price_delta_cents: 0
            description: Standard-duty steel front bumper.
          - slug: bumper-heavy
            name: Heavy-Duty Winch Bumper
            price_delta_cents: 220000
            description: Reinforced bumper rated for a winch mount.
            model_effect:
              nodes: [bristlecone_recovery-protection_bumper-heavy]
          - slug: winch-12000
            name: 12,000 lb Winch
            price_delta_cents: 340000
            description: Electric winch, 12,000 lb capacity. Requires the heavy-duty bumper.
            model_effect:
              nodes: [bristlecone_recovery-protection_winch-12000]
          - slug: rock-sliders
            name: Rock Sliders
            price_delta_cents: 95000
            description: Bolt-on rock sliders protecting the rocker panels.
            model_effect:
              nodes: [bristlecone_recovery-protection_rock-sliders]

      - slug: roof-storage
        name: Roof & Storage
        selection_mode: multi
        required: false
        display_style: toggle
        options:
          - slug: rooftop-tent
            name: Rooftop Tent
            price_delta_cents: 380000
            description: Hard-shell rooftop tent, sleeps two. Conflicts with the maximum solar array.
            model_effect:
              nodes: [bristlecone_roof-storage_rooftop-tent]
          - slug: roof-rack-basic
            name: Roof Rack
            price_delta_cents: 60000
            description: Low-profile roof rack for gear.
            model_effect:
              nodes: [bristlecone_roof-storage_roof-rack-basic]

      - slug: exterior-finish
        name: Exterior Finish
        selection_mode: single
        required: true
        display_style: swatch
        options:
          - slug: finish-satin-black
            name: Satin Black
            price_delta_cents: 0
            description: Satin black finish over the composite shell.
            swatch:
              url: /images/bristlecone/swatches/finish-satin-black.png
              alt_text: Satin black paint swatch
            model_effect:
              material_target: body_paint
              base_color_hex: "#1b1b1b"
          - slug: finish-desert-tan
            name: Desert Tan
            price_delta_cents: 0
            description: Desert tan finish over the composite shell.
            swatch:
              url: /images/bristlecone/swatches/finish-desert-tan.png
              alt_text: Desert tan paint swatch
            model_effect:
              material_target: body_paint
              base_color_hex: "#c2a374"
          - slug: finish-forest-green
            name: Forest Green
            price_delta_cents: 0
            description: Forest green finish over the composite shell.
            swatch:
              url: /images/bristlecone/swatches/finish-forest-green.png
              alt_text: Forest green paint swatch
            model_effect:
              material_target: body_paint
              base_color_hex: "#2f4a34"

