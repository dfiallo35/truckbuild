name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # tests/test_catalog_api.py is a contract test against a real seeded database, not a mock.
    # Without this service those nine tests fail on every run, which is how they went unnoticed
    # through stages 1-3. Published on 5432 here: the 5433 mapping exists only to keep a
    # developer's own Postgres off the port, and there is no host Postgres on a runner.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: truckbuild
          POSTGRES_PASSWORD: truckbuild
          POSTGRES_DB: truckbuild
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truckbuild -d truckbuild"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://truckbuild:truckbuild@localhost:5432/truckbuild

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      # --no-revalidate: a seed run tells the web app to drop its catalog cache, and there is no
      # web app in this job. The webhook itself is covered by tests/test_revalidate.py.
      - run: uv run python -m app.seed --no-revalidate
      # Re-running the seed must not change anything; the upsert-by-slug contract is what makes
      # it safe to run on every deploy.
      - run: uv run python -m app.seed --no-revalidate
      - run: uv run pytest -q

  web:
    name: Web — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    # `pnpm build` prerenders the catalog: generateStaticParams and every `use cache` read go
    # through GET /v1/catalog. Without a real API behind API_BASE_URL the build fails outright,
    # so the job runs the same Postgres + FastAPI pair a deploy does. Building against a stub
    # would leave the one thing this build is meant to prove -- that catalog pages prerender --
    # untested.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: truckbuild
          POSTGRES_PASSWORD: truckbuild
          POSTGRES_DB: truckbuild
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truckbuild -d truckbuild"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://truckbuild:truckbuild@localhost:5432/truckbuild
      # Server-side only, never NEXT_PUBLIC_ — the browser must not learn the API origin.
      API_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: api
      - run: uv run alembic upgrade head
        working-directory: api
      # Nothing to revalidate: the web app is built further down but is not running yet, and
      # the build reads the catalog through the API rather than through a cache.
      - run: uv run python -m app.seed --no-revalidate
        working-directory: api
      - name: Start the API
        working-directory: api
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && exit 0
            sleep 1
          done
          echo "API did not become healthy" >&2
          exit 1

      # `defaults.run.working-directory` applies only to `run` steps, not to `uses` steps, so
      # this action starts at the repo root where there is no package.json. Point it at the
      # one that carries the `packageManager` pin rather than duplicating the version here.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      # The TypeScript half of the pricing mirror. It reads fixtures/pricing-cases.json and
      # api/seed/catalog.yaml from the repo root, so it fails here the moment the Python half
      # moves without it (see .claude/skills/pricing-mirror).
      - run: pnpm test

      # Redirected rather than piped: piping a build through `tee` would replace its exit
      # status with the pager's, which is a mistake this repo has already made once.
      #
      # If "Cache Components enabled" ever stops appearing, next.config.ts is not being picked
      # up and every caching assumption in the design is void — a build failure, not cosmetic.
      - name: Build (Cache Components must stay enabled)
        run: |
          if ! pnpm build > build.log 2>&1; then
            cat build.log
            exit 1
          fi
          cat build.log
          grep -q -- "- Cache Components enabled" build.log
